name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf libncurses5-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc zlib1g-dev android-sdk-libsparse-utils android-sdk-platform-tools

      - name: Set up Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Initialize and Sync TWRP Source
        run: |
          mkdir twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          git clone https://github.com/${{ github.repository }} twrp/device/xiaomi/fire

      - name: Auto Extract Kernel from Stock boot.img
        run: |
          cd twrp/device/xiaomi/fire
          mkdir -p prebuilt
          
          # Check for image file
          path_img=""
          if [ -f "boot.img" ]; then
            path_img="boot.img"
          elif [ -f "prebuilt/boot.img" ]; then
            path_img="prebuilt/boot.img"
          elif [ -f "vendor_boot.img" ]; then
            path_img="vendor_boot.img"
          elif [ -f "prebuilt/vendor_boot.img" ]; then
            path_img="prebuilt/vendor_boot.img"
          fi
          
          echo "Extracting kernel automatically from $path_img ..."
          wget -q https://raw.githubusercontent.com/carlitoxxPro/magiskboot-binaries/main/x86_64/magiskboot -O magiskboot
          chmod +x magiskboot
          ./magiskboot unpack -h "$path_img"
          mv kernel prebuilt/kernel
          echo "Kernel auto-extracted successfully!"

      - name: Build TWRP
        run: |
          cd twrp
          source build/envsetup.sh
          lunch twrp_fire-eng || lunch twrp_fire-userdebug
          make bootimage vendorbootimage recoveryimage -j$(nproc --all)
          echo "=== Checking Output Files ==="
          ls -la out/target/product/fire/

      - name: Upload TWRP Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_Recovery_Fire
          path: |
            twrp/out/target/product/fire/boot.img
            twrp/out/target/product/fire/vendor_boot.img
            twrp/out/target/product/fire/recovery.img
            twrp/out/target/product/fire/*.img
          if-no-files-found: warn
