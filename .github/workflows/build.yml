name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Clean Up Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo apt-get clean

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev python3

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Source
      run: |
        mkdir twrp
        cd twrp
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        repo sync -j$(nproc --all)

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/${{ github.repository }} device/xiaomi/fire

    - name: Build TWRP
      run: |
        cd twrp
        source build/envsetup.sh
        lunch twrp_fire-eng || lunch twrp_fire-userdebug
        mka vendor_bootimage -j$(nproc --all) || mka recoveryimage -j$(nproc --all)

    - name: Upload Output Image
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Build-Redmi12
        path: |
          twrp/out/target/product/fire/vendor_boot.img
          twrp/out/target/product/fire/recovery.img
